<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Correo confirmado · JOI 360</title>
<!--
  Página suelta, fuera del router del app.

  Supabase devuelve el resultado de la verificación en el fragmento de la URL
  (#access_token=… o #error=…) y el superapp usa HashRouter: si esto viviera en
  una ruta del app, las dos cosas se pelearían por el mismo '#'.

  No hace nada más que decir si el correo quedó activo. La sesión se inicia en
  el app, con la contraseña, que es donde corresponde.
-->
<style>
  :root{
    --primary:#3525cd; --ink:#1b1b24; --muted:#56546b;
    --bg:#fcf8ff; --surface:#ffffff; --border:#e4e1ee;
    --ok:#128a5b; --ok-soft:#e3f6ec;
    --danger:#c62828; --danger-soft:#fdecec;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#f4f2fb; --muted:#a5a2b8; --bg:#131220; --surface:#1c1b2c; --border:#2e2c42; --ok-soft:#12301f; --danger-soft:#3a1d1d; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:400px; background:var(--surface);
    border:1px solid var(--border); border-radius:24px; padding:36px 28px 32px;
    text-align:center;
  }
  .marca{
    width:52px; height:52px; margin:0 auto 26px; border-radius:16px;
    background:var(--primary); color:#fff; display:grid; place-items:center;
    font-weight:800; letter-spacing:-.04em; font-size:15px;
  }
  .sello{
    width:76px; height:76px; margin:0 auto 22px; border-radius:50%;
    display:grid; place-items:center; font-size:36px; line-height:1;
    background:var(--ok-soft); color:var(--ok);
  }
  .sello.malo{ background:var(--danger-soft); color:var(--danger); }
  h1{ font-size:24px; line-height:1.2; margin:0 0 10px; letter-spacing:-.02em; text-wrap:balance; }
  p{ font-size:15px; line-height:1.55; color:var(--muted); margin:0; }
  .pie{ margin-top:26px; font-size:12px; color:var(--muted); opacity:.7; }
</style>
</head>
<body>
  <main class="card">
    <div class="marca">JOI</div>
    <div class="sello" id="sello">✓</div>
    <h1 id="titulo">Correo confirmado</h1>
    <p id="detalle">Tu cuenta quedó activa. Vuelve a la app JOI 360 e inicia sesión con tu correo y contraseña.</p>
    <p class="pie">RedPontis S.A.C. · Lima, Perú</p>
  </main>

<script>
  // Supabase manda el error en el fragmento cuando el enlace ya venció o ya
  // se usó. Decirlo es más útil que mostrar un check verde que miente.
  var frag = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var error = frag.get("error_description") || frag.get("error");
  if (error) {
    document.getElementById("sello").textContent = "!";
    document.getElementById("sello").classList.add("malo");
    document.getElementById("titulo").textContent = "El enlace ya no sirve";
    document.getElementById("detalle").textContent =
      "Puede que haya vencido o que ya lo hayas usado. Vuelve a la app y pide que te reenviemos el correo.";
  }
  // El fragmento carga tokens de sesión: se limpia de la barra de direcciones
  // para que no queden en el historial ni en un enlace compartido.
  if (window.location.hash) {
    history.replaceState(null, "", window.location.pathname);
  }
</script>
</body>
</html>
